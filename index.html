<!DOCTYPE html>
<html>
<head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
</head>
<body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="logarithmicDepthBuffer: true;">
        <!-- 画像マーカーの指定（.fset等のファイル名を指定） -->
        <a-nft type="nft" url="path/to/your-image-name" smooth="true">
            <!-- ここに3Dモデルを配置 -->
            <a-entity gltf-model="path/to/model.glb" scale="50 50 50" position="0 0 0"></a-entity>
        </a-nft>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
